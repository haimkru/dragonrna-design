[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonrna-design"
version = "0.1.0"
description = "Sequence design for self-priming foldback oligos and non-folding oligos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Haim Krupkin", email = "hkrupkin@stanford.edu" }]
keywords = ["oligonucleotide", "sequence-design", "ViennaRNA", "RNA", "DNA"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["ViennaRNA>=2.5"]

[project.urls]
Homepage = "https://github.com/haimkru/dragonrna-design"

[project.scripts]
design-dragonrna = "design_dragonrna:main"
generate-dragonrna = "generate_dragonrna:main"
generate-nonfolding-oligo = "generate_nonfolding_oligo:main"

[tool.setuptools]
py-modules = [
    "design_dragonrna",
    "generate_dragonrna",
    "generate_nonfolding_oligo",
]
